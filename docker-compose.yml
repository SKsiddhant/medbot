services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env        # optional: copy .env.example to .env to add your API keys
        required: false
    environment:               # inside the network the services are reached by name, not localhost
      DATABASE_URL: postgresql://medbot:medbot@db:5432/medbot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medbot
      POSTGRES_PASSWORD: medbot
      POSTGRES_DB: medbot
    ports:
      - "127.0.0.1:5432:5432"   # local only; the password is a dev default
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
